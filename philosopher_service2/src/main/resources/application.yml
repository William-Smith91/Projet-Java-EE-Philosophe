server:
  port: 0        # port aléatoire : on peut lancer autant d'instances qu'on veut

spring:
  application:
    name: philosopher-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

philosopher:
  id: ${PHILOSOPHER_ID:}     # vide = identifiant généré au démarrage
  topic: philosopher-events
  think-min-ms: 2000
  think-max-ms: 6000
  hungry-max-ms: 3000
  eat-min-ms: 1000
  eat-max-ms: 4000
  
  